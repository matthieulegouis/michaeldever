# Netlify build configuration — static Astro site (no adapter needed).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Temporary redirects until the revised translations are ready.
[[redirects]]
  from = "/fr"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/fr/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/de"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/de/*"
  to = "/"
  status = 302
  force = true
